name: xuansi-web
services:
  db:
    image: postgres:18
    # 开发数据库只绑定回环地址；生产部署必须使用密码认证与独立配置。
    environment:
      POSTGRES_USER: xuansi
      POSTGRES_DB: xuansi
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xuansi -d xuansi"]
      interval: 3s
      timeout: 3s
      retries: 30
  mail:
    image: axllent/mailpit:v1.31.0
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    profiles: [app]
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    environment: &app_environment
      DATABASE_URL: postgres://xuansi@db:5432/xuansi?sslmode=disable
      APP_ENV: development
      APP_URL: ${APP_URL:-http://localhost:3000}
      HTTP_ADDRESS: 0.0.0.0:8080
      STORAGE_DRIVER: local
      STORAGE_PATH: /app/data/storage
      SMTP_HOST: mail
      SMTP_PORT: 1025
      SMTP_FROM: noreply@localhost
      OAUTH_SECRET: ${OAUTH_SECRET:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      # API 与 worker 复用同一收件目标；真实授权仅留在服务端环境。
      FEEDBACK_GITHUB_REPOSITORY: ${FEEDBACK_GITHUB_REPOSITORY:-}
      FEEDBACK_GITHUB_PUBLIC: ${FEEDBACK_GITHUB_PUBLIC:-false}
      FEEDBACK_GITHUB_TOKEN: ${FEEDBACK_GITHUB_TOKEN:-}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - resource_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 4s
      retries: 12
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_healthy
  worker:
    profiles: [app]
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    entrypoint: [/app/worker]
    environment: *app_environment
    volumes:
      - resource_data:/app/data
    depends_on:
      api:
        condition: service_healthy
  frontend:
    profiles: [app]
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
      args:
        API_ORIGIN: http://api:8080
    environment:
      API_ORIGIN: http://api:8080
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
  resource_data:
