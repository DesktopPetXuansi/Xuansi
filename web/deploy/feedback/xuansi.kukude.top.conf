# 新增虚拟主机，不接管已有项目。通配符 Origin 证书仅供 Cloudflare 回源。
log_format xuansi_feedback '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen 80;
    server_name xuansi.kukude.top;
    return 301 https://xuansi.kukude.top$request_uri;
}

server {
    listen 443 ssl;
    server_name xuansi.kukude.top;
    ssl_certificate /etc/nginx/certs/kukude.top.pem;
    ssl_certificate_key /etc/nginx/certs/kukude.top.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 2026-10-20 核对 https://www.cloudflare.com/ips-v4/ 与 ips-v6/。
    # 仅 Cloudflare 网段可提供真实IP，随后覆盖客户端自行传入的转发头。
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    access_log /dev/stdout xuansi_feedback;
    client_max_body_size 32k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = / {
        default_type text/plain;
        charset utf-8;
        return 200 "玄司反馈服务。请在玄司软件内打开帮助与反馈。\n";
    }

    # API 自身精确限制方法、CSRF、Origin、幂等键和正文大小。
    location = /api/v1/auth/csrf {
        proxy_pass http://172.17.0.1:18188;
        proxy_set_header Host xuansi.kukude.top;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
    }
    location = /api/v1/feedback {
        proxy_pass http://172.17.0.1:18188;
        proxy_set_header Host xuansi.kukude.top;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
    }
    location / { return 404; }
}
