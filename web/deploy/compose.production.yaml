# 独立生产模板；仅 Caddy 暴露端口，真实凭据由外部环境文件提供。
name: xuansi-web-production
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: xuansi
      POSTGRES_DB: xuansi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?配置数据库密码}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U xuansi -d xuansi]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]
    restart: unless-stopped
  api:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    environment: &backend_environment
      APP_ENV: production
      APP_URL: ${APP_URL:?配置HTTPS官网地址}
      HTTP_ADDRESS: 0.0.0.0:8080
      DATABASE_URL: ${DATABASE_URL:?配置容器内数据库连接串}
      OAUTH_SECRET: ${OAUTH_SECRET:?配置至少32字符稳定密钥}
      TRUSTED_PROXY_CIDRS: 172.30.253.2/32,172.30.253.3/32
      STORAGE_DRIVER: s3
      S3_ENDPOINT: ${S3_ENDPOINT:?配置S3或R2端点}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:?配置私有桶}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?配置存储访问密钥}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?配置存储秘密密钥}
      SMTP_HOST: ${SMTP_HOST:?配置SMTP服务器}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:?配置发件地址}
      SMTP_USER: ${SMTP_USER:?配置SMTP用户}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?配置SMTP密码}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-536870912}
      USER_QUOTA_BYTES: ${USER_QUOTA_BYTES:-2147483648}
      FEEDBACK_GITHUB_REPOSITORY: ${FEEDBACK_GITHUB_REPOSITORY:-}
      FEEDBACK_GITHUB_PUBLIC: ${FEEDBACK_GITHUB_PUBLIC:-false}
      FEEDBACK_GITHUB_TOKEN: ${FEEDBACK_GITHUB_TOKEN:-}
      UMAMI_PUBLIC_URL: ${UMAMI_PUBLIC_URL:-}
      UMAMI_API_URL: ${UMAMI_API_URL:-}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      UMAMI_API_KEY: ${UMAMI_API_KEY:-}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/readyz']
      interval: 5s
      timeout: 4s
      retries: 20
    depends_on:
      db: {condition: service_healthy}
    networks: [private]
    restart: unless-stopped
  worker:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    entrypoint: [/app/worker]
    environment: *backend_environment
    depends_on:
      api: {condition: service_healthy}
    networks: [private]
    restart: unless-stopped
  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        API_ORIGIN: http://api:8080
        SITE_URL: ${APP_URL:?配置HTTPS官网地址}
    environment: {API_ORIGIN: 'http://api:8080'}
    depends_on:
      api: {condition: service_healthy}
    networks:
      private: {ipv4_address: 172.30.253.3}
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?配置域名}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend, api]
    networks:
      private: {ipv4_address: 172.30.253.2}
    restart: unless-stopped
networks:
  private:
    driver: bridge
    ipam:
      config: [{subnet: 172.30.253.0/28}]
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
