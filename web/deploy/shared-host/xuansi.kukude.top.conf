# 只替换玄司虚拟主机；URI 日志不包含邮件令牌、OAuth code 或 S3 签名查询。
log_format xuansi_web '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen 80;
    server_name xuansi.kukude.top;
    return 301 https://xuansi.kukude.top$request_uri;
}

server {
    listen 443 ssl;
    server_name xuansi.kukude.top;
    ssl_certificate /etc/nginx/certs/kukude.top.pem;
    ssl_certificate_key /etc/nginx/certs/kukude.top.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Cloudflare 官方网段；只接受这些来源提供的真实客户端 IP。
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    access_log /dev/stdout xuansi_web;
    client_max_body_size 100000000;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # 运维探针只在内网开放。
    location = /healthz { return 404; }
    location = /readyz { return 404; }

    location /api/ {
        proxy_pass http://172.17.0.1:18189;
        proxy_set_header Host xuansi.kukude.top;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }
    location /oauth/ {
        proxy_pass http://172.17.0.1:18189;
        proxy_set_header Host xuansi.kukude.top;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    # S3 path-style 路径参与签名，proxy_pass 不附 URI、不移除桶名。
    location ^~ /xuansi-resources/ {
        proxy_pass http://172.17.0.1:19000;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie "";
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'" always;
    }
    location / {
        proxy_pass http://172.17.0.1:18190;
        proxy_set_header Host xuansi.kukude.top;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }
}
